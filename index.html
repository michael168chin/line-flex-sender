<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秦國維(Michael/麥哥) 專業名片 V6</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f7f9fc; }
        .card { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; max-width: 85%; }
        h2 { color: #00B900; margin-bottom: 0.5rem; }
        p { color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
        .btn-send { padding: 16px 40px; font-size: 1.1rem; background: linear-gradient(135deg, #00E000 0%, #00B900 100%); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,185,0,0.3); }
        .version-tag { margin-top: 15px; font-size: 12px; color: #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>數位名片發送器</h2>
        <p>宏國通訊處<br>保險行銷 | 組織經營 | AI應用</p>
        <button class="btn-send" onclick="sendFlex()">選擇好友發送名片</button>
        <div class="version-tag">系統版本：V6 (含分享功能)</div>
    </div>

    <script>
        async function initLiff() {
            try {
                await liff.init({ liffId: "1596825091-r2blOZQp" });
                if (!liff.isLoggedIn()) { liff.login(); }
            } catch (err) { console.error("LIFF 初始化失敗", err); }
        }

        async function sendFlex() {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const result = await liff.shareTargetPicker([
                        {
                            "type": "flex",
                            "altText": "您收到來自 秦國維(Michael/麥哥) 的專業數位名片",
                            "contents": {
                                "type": "bubble",
                                "header": {
                                    "type": "box", "layout": "vertical", "contents": [
                                        { "type": "text", "text": "宏國通訊處", "color": "#ffffff", "size": "sm", "weight": "bold" }
                                    ], "backgroundColor": "#00B900"
                                },
                                "body": {
                                    "type": "box", "layout": "vertical", "contents": [
                                        { "type": "text", "text": "秦國維(Michael/麥哥)", "weight": "bold", "size": "xl", "margin": "md", "wrap": true },
                                        { "type": "text", "text": "保險行銷與組織發展專家", "size": "sm", "color": "#00B900", "weight": "bold" },
                                        { "type": "separator", "margin": "lg" },
                                        { "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm", "contents": [
                                            { 
                                                "type": "text", "text": "💡 專業保險諮詢", "size": "sm", "color": "#0000FF", "decoration": "underline",
                                                "action": { "type": "uri", "label": "諮詢", "uri": "https://line.me/ti/p/uvO4HDn1_X" }
                                            },
                                            { 
                                                "type": "text", "text": "🚀 團隊組織經營", "size": "sm", "color": "#0000FF", "decoration": "underline",
                                                "action": { "type": "uri", "label": "經營", "uri": "https://line.me/ti/p/uvO4HDn1_X" }
                                            },
                                            { 
                                                "type": "text", "text": "🤖 AI工具應用導入", "size": "sm", "color": "#0000FF", "decoration": "underline",
                                                "action": { "type": "uri", "label": "AI應用", "uri": "https://line.me/ti/p/uvO4HDn1_X" }
                                            }
                                        ]},
                                        { "type": "text", "text": "Ver. 6", "size": "xxs", "color": "#eeeeee", "align": "end" }
                                    ]
                                },
                                "footer": {
                                    "type": "box", "layout": "vertical", "spacing": "sm", "contents": [
                                        { 
                                          "type": "button", 
                                          "action": { "type": "uri", "label": "立即聯繫", "uri": "https://line.me/ti/p/uvO4HDn1_X" }, 
                                          "style": "primary", "color": "#00B900" 
                                        },
                                        { 
                                          "type": "button", 
                                          "action": { "type": "uri", "label": "推薦給好友", "uri": "https://liff.line.me/1596825091-r2blOZQp" }, 
                                          "style": "secondary", "color": "#555555" 
                                        }
                                    ]
                                }
                            }
                        }
                    ]);
                    if (result) { liff.closeWindow(); }
                } catch (error) { alert("發送已取消"); }
            }
        }
        initLiff();
    </script>
</body>
</html>
